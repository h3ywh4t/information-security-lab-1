name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify

  sast:
    name: SpotBugs SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Analyze sources
        run: mvn -B -ntp compile spotbugs:spotbugs spotbugs:check
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: spotbugs-report
          path: target/reports/spotbugs.html
          if-no-files-found: error

  sca:
    name: Dependency-Check SCA
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-13-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-13-${{ runner.os }}-
      - name: Audit dependencies
        run: mvn -B -ntp dependency-check:check
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: error
